name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - run: dotnet build Ai.Tlbx.Sip.slnx -c Release
      - run: dotnet run --project tests/Ai.Tlbx.Sip.Tests -c Release --no-build
      - run: dotnet pack src/Ai.Tlbx.Sip -c Release --no-build -o artifacts
      - run: dotnet pack src/Ai.Tlbx.VoiceAssistant.Sip -c Release --no-build -o artifacts
